<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MCP Network Diagnostics{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1419;
            color: #e6edf3;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 0;
            margin-bottom: 24px;
        }

        nav {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        nav h1 {
            font-size: 20px;
            font-weight: 600;
            margin-right: auto;
        }

        nav a {
            color: #8b949e;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        nav a:hover, nav a.active {
            background: #21262d;
            color: #e6edf3;
        }

        .nav-identity {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #8b949e;
        }
        .nav-identity .guest-label { color: #8b949e; }
        .nav-identity .guest-hint { font-size: 12px; color: #6e7681; margin-left: 4px; }
        .nav-identity a.sign-in { color: #58a6ff; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
        }

        .stat-label {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 600;
            color: #58a6ff;
        }

        .stat-sub {
            color: #8b949e;
            font-size: 14px;
            margin-top: 4px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #30363d;
            color: #8b949e;
            font-weight: 600;
            font-size: 14px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #21262d;
        }

        tr:hover {
            background: #0d1117;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-critical { background: #da3633; color: #fff; }
        .badge-warning { background: #d29922; color: #000; }
        .badge-info { background: #1f6feb; color: #fff; }
        .badge-success { background: #2da44e; color: #fff; }

        .health-score {
            font-size: 48px;
            font-weight: 700;
        }

        .health-good { color: #2da44e; }
        .health-warning { color: #d29922; }
        .health-critical { color: #da3633; }

        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .btn {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 6px;
            background: #238636;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
        }

        .btn:hover {
            background: #2ea043;
            text-decoration: none;
        }

        .btn-secondary {
            background: #21262d;
            color: #e6edf3;
        }

        .btn-secondary:hover {
            background: #30363d;
        }

        .time {
            color: #8b949e;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <h1>🌐 MCP Network Diagnostics</h1>
                <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Overview</a>
                <a href="/tools" class="{% if '/tools' in request.url.path %}active{% endif %}">Tools</a>
                <a href="/devices" class="{% if '/devices' in request.url.path %}active{% endif %}">Devices</a>
                <a href="/incidents" class="{% if '/incidents' in request.url.path %}active{% endif %}">Incidents</a>
                <a href="/intents" class="{% if '/intents' in request.url.path %}active{% endif %}">Intents</a>
                <a href="/developer" class="{% if '/developer' in request.url.path %}active{% endif %}">Developer</a>
                <a href="/settings" class="{% if '/settings' in request.url.path %}active{% endif %}">Settings</a>
                <div class="nav-identity">
                    {% if request.state.consumer_identity %}
                    <span class="guest-label">Using as guest</span><span class="guest-hint">(session-only data, no account)</span>
                    <a href="#" class="sign-in">Sign in</a>
                    {% else %}
                    <a href="/" class="sign-in">Continue as guest</a>
                    {% endif %}
                </div>
            </nav>
            <div id="system-status" class="system-status-wrap" hx-get="/partials/status" hx-trigger="load, every 15s" hx-swap="innerHTML">
                <div class="system-status-bar" role="status"><span class="system-status-value">Loading…</span></div>
            </div>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
