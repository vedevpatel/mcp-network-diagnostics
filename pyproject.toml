[project]
name = "mcp-network"
version = "0.1.0"
description = "MCP server for network diagnostics"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "fastmcp>=3.0.0b1",
    "networkx>=3.0",
    "pydantic>=2.0",
    "prometheus-api-client>=0.5.3",
    "pyyaml>=6.0",
    "netmiko>=4.0.0",
    "aiohttp>=3.9.0",
    "cryptography>=41.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
mcp_network = [
    "dashboard/templates/**/*.html",
    "dashboard/static/**/*.css",
    "dashboard/static/**/*.js",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
mcp-network = "mcp_network.__main__:main"
