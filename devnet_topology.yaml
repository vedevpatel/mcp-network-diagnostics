# Cisco DevNet Always-On sandbox topology
#
# Three-device topology: IOS-XR router → Nexus 9000 switch → IOS-XE router.
# All links are synthetic — these sandboxes are independent machines.
# Real CPU/memory/interface metrics are collected via SSH from each device.
#
# Set these env vars before starting the server:
#   export DEVNET_IOSXR_USERNAME=<your username>
#   export DEVNET_IOSXR_PASSWORD=<your password>
#   export DEVNET_NXOS_USERNAME=<your username>
#   export DEVNET_NXOS_PASSWORD=<your password>
#   export DEVNET_IOSXE_USERNAME=<your username>
#   export DEVNET_IOSXE_PASSWORD=<your password>

devices:
  - id: devnet-iosxr-1
    type: router
    device_type: iosxr
    host: sandbox-iosxr-1.cisco.com
    username: ${DEVNET_IOSXR_USERNAME}
    password: ${DEVNET_IOSXR_PASSWORD}
    port: 22

  - id: devnet-nexus-1
    type: switch
    device_type: nxos
    host: sbx-nxos-mgmt.cisco.com
    username: ${DEVNET_NXOS_USERNAME}
    password: ${DEVNET_NXOS_PASSWORD}
    port: 22

  - id: devnet-iosxe-1
    type: router
    device_type: iosxe
    host: devnetsandboxiosxe.cisco.com
    username: ${DEVNET_IOSXE_USERNAME}
    password: ${DEVNET_IOSXE_PASSWORD}
    port: 22

links:
  # IOS-XR → Nexus
  - src_device: devnet-iosxr-1
    src_interface: GigabitEthernet0/0/0/0
    dst_device: devnet-nexus-1
    dst_interface: Eth1/1
    default_latency_ms: 38.0

  # Nexus → IOS-XE
  - src_device: devnet-nexus-1
    src_interface: Eth1/2
    dst_device: devnet-iosxe-1
    dst_interface: GigabitEthernet1
    default_latency_ms: 42.0
