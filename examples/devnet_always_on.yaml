# Example topology for Cisco DevNet Always-On IOS XE Sandbox
# https://devnetsandbox.cisco.com/RM/Diagram/Index/27d9747a-db48-4565-8d44-df318fce37ad
#
# This sandbox is always available without reservation.
# Credentials: admin / C1sco12345

devices:
  - id: cat8kv
    host: sandbox-iosxe-latest-1.cisco.com
    port: 22
    username: admin
    password: C1sco12345
    device_type: iosxe  # Maps to cisco_ios in Netmiko
    type: router

# Thresholds for alerting and trend analysis
thresholds:
  cpu: 80.0
  utilization: 75.0
  errors: 100

  # Anomaly detection configuration (optional)
  anomaly:
    z_score_threshold: 2.0
    rate_shift_threshold: 3.0
    volatility_ratio_threshold: 3.0
    min_samples: 5

# Local device for diagnose_from_here() tool
local_device: cat8kv

# Note: This is a single-device topology for testing.
# For multi-device testing, reserve a full sandbox or use
# multiple Always-On instances (see devnet_multi.yaml)
