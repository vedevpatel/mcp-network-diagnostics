# DevNet IOS-XE reservation sandbox — 2-device topology
#
# Cat8kv (IOS-XE 17.12) + Nexus 9K (NX-OS)
# IOS-XRv excluded: ssh-dss-only host key, incompatible with paramiko 4.x
#
# VPN in first (AnyConnect → devnetsandbox-usw1-reservation.cisco.com:20282)
# then start:
#   export DEVNET_IOSXE_USERNAME=developer
#   export DEVNET_IOSXE_PASSWORD=C1sco12345
#   export DEVNET_NXOS_USERNAME=admin
#   export DEVNET_NXOS_PASSWORD='RG!_Yw200'
#   uv run mcp-network --collector ssh --topology-file iosxe_topology.yaml

local_device: cat8kv

devices:
  - id: cat8kv
    type: router
    device_type: iosxe
    host: 10.10.20.48
    username: ${DEVNET_IOSXE_USERNAME}
    password: ${DEVNET_IOSXE_PASSWORD}
    port: 22

  - id: nexus9k
    type: switch
    device_type: nxos
    host: 10.10.20.40
    username: ${DEVNET_NXOS_USERNAME}
    password: ${DEVNET_NXOS_PASSWORD}
    port: 22

links:
  # Synthetic link — these VMs are not physically cabled.
  # Latency is illustrative; the collector will pull real CPU/intf metrics
  # from both devices and the path tools will use this edge.
  - src_device: cat8kv
    src_interface: GigabitEthernet1
    dst_device: nexus9k
    dst_interface: Eth1/1
    default_latency_ms: 5.0
