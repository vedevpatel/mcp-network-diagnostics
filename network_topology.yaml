# Network Topology Configuration for Prometheus Collector
# This file defines which devices to monitor and how they're connected.
# This template works for Docker testing. Customize it for your homelab setup.

devices:
  # Single device (localhost) for testing
  - id: localhost
    type: router
    prometheus_labels:
      instance: "host.docker.internal:9100"
      job: "node_exporter"
    interfaces:
      - name: eth0
        prometheus_name: eth0
        link_speed_mbps: 1000

  # Add more devices for homelab:
  # - id: router-1
  #   type: router
  #   prometheus_labels:
  #     instance: "192.168.1.1:9100"
  #     job: "node_exporter"
  #   interfaces:
  #     - name: eth0
  #       prometheus_name: eth0
  #       link_speed_mbps: 1000

links:
  # Example: Single device has no links
  []

